name: PR Review - Ruff Lint

on:
  pull_request:
    branches:
      - main

  
jobs:
  ruff-review:
    runs-on: ubuntu-latest
    # Required permissions to post review comments to the PR
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      # Setup Reviewdog binary executable
      - name: Set up Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # Execute Ruff, format as rdjson, and pipe to reviewdog
      - name: Post Lint Errors as PR Comments
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format=rdjson . | reviewdog \
            -f=rdjson \
            -name="ruff" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=error
