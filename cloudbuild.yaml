logsBucket: '${_BUILD_LOGS_BUCKET}'

substitutions:
  _GITHUB_REPO_NAME: 'deal-health-score-dags'

options:
  logging: GCS_ONLY

steps:
  - id: ruff-check
    name: ghcr.io/astral-sh/ruff:0.15.13
    dir: /workspace
    allowFailure: true
    args:
      - check
      - .
      - --output-format=json
      - --output-file=ruff.json

  - id: ruff-report
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    dir: /workspace
    waitFor: ['ruff-check']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        export REPO="$${REPO_FULL_NAME:-${_GITHUB_REPO_NAME}}"
        export BUILD_ID="${BUILD_ID}"
        export BUILD_DATE="$$(date -u +%Y-%m-%d)"
        export LOG_NAME="ruff-$$(echo "$${REPO}" | tr '/:' '-' | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]')"

        python3 <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        repo = os.environ["REPO"]
        build_id = os.environ["BUILD_ID"]
        build_date = os.environ["BUILD_DATE"]
        log_name = os.environ["LOG_NAME"]

        path = Path("ruff.json")
        findings = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else []
        if not isinstance(findings, list):
            findings = []

        def write_log(payload: dict, severity: str) -> None:
            line = json.dumps(payload, separators=(",", ":"), ensure_ascii=False)
            print(line)
            subprocess.run(
                [
                    "gcloud",
                    "logging",
                    "write",
                    log_name,
                    line,
                    "--payload-type=json",
                    f"--severity={severity}",
                ],
                check=True,
            )

        if not findings:
            write_log(
                {
                    "repository": repo,
                    "build_id": build_id,
                    "build_date": build_date,
                    "status": "PASSED",
                    "finding_count": 0,
                },
                "INFO",
            )
            print("Ruff check passed.")
            raise SystemExit(0)

        print(f"========== Ruff findings ({len(findings)}) ==========")
        for item in findings:
            loc = item.get("location") or {}
            end = item.get("end_location") or {}
            entry = {
                "repository": repo,
                "build_id": build_id,
                "build_date": build_date,
                "status": "FAILED",
                "rule": item.get("code"),
                "file": item.get("filename"),
                "line": loc.get("row"),
                "column": loc.get("column"),
                "end_line": end.get("row"),
                "end_column": end.get("column"),
                "message": item.get("message"),
                "url": item.get("url"),
            }
            write_log(entry, "ERROR")

        print(f"Posted {len(findings)} JSON log entry/entries to {log_name}")
        print("ERROR: Ruff check failed. Fix lint issues before merging.")
        raise SystemExit(1)
        PY
