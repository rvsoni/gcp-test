logsBucket: '${_BUILD_LOGS_BUCKET}'

substitutions:
  _GITHUB_REPO_NAME: 'deal-health-score-dags'

options:
  logging: GCS_ONLY

steps:
  # Distroless image: use default "ruff" entrypoint only (no shell).
  - id: ruff-check
    name: ghcr.io/astral-sh/ruff:0.15.13
    dir: /workspace
    allowFailure: true
    args:
      - check
      - .
      - --output-format=github
      - --output-file=ruff-github.txt

  # Shell step: print report, post each finding to Cloud Logging, fail PR if needed.
  - id: ruff-report
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    dir: /workspace
    waitFor: ['ruff-check']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        repo="$${REPO_FULL_NAME:-${_GITHUB_REPO_NAME}}"
        repo_safe="$$(echo "$${repo}" | tr '/:' '-' | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]')"
        repo_safe="$${repo_safe:-unknown-repo}"
        build_date="$$(date -u +%Y-%m-%d)"
        log_name="ruff-$${repo_safe}"

        echo "========== Ruff GitHub report =========="
        if [ -s ruff-github.txt ]; then
          cat ruff-github.txt
        else
          echo "No issues — Ruff check passed."
        fi
        echo "======================================="

        finding_count=0
        if [ -f ruff-github.txt ]; then
          while IFS= read -r line || [ -n "$${line}" ]; do
            [ -z "$${line}" ] && continue
            case "$${line}" in
              ::error*)   entry_severity="ERROR" ;;
              ::warning*) entry_severity="WARNING" ;;
              ::notice*)  entry_severity="INFO" ;;
              *) continue ;;
            esac
            gcloud logging write "$${log_name}" "$${line}" \
              --payload-type=text \
              --severity="$${entry_severity}"
            finding_count=$$((finding_count + 1))
          done < ruff-github.txt
        fi

        if [ "$${finding_count}" -eq 0 ]; then
          gcloud logging write "$${log_name}" \
            "Ruff PASSED | $${repo} | $${build_date} | build $${BUILD_ID}" \
            --severity=INFO
          echo "Ruff check passed."
        else
          echo "Posted $${finding_count} finding(s) to log $${log_name}"
          echo "ERROR: Ruff check failed. Fix lint issues before merging."
          exit 1
        fi
