logsBucket: '${_BUILD_LOGS_BUCKET}'

substitutions:
  # Existing bucket (name or gs:// URI); optional — omit to skip GCS
  #_RUFF_REPORTS_BUCKET: ''
  # Used when REPO_FULL_NAME is not provided by the GitHub trigger
  _GITHUB_REPO_NAME: 'deal-health-score-dags'

options:
  logging: GCS_ONLY

steps:
  - id: ruff-check
    name: ghcr.io/astral-sh/ruff:0.15.13
    dir: /workspace
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        mkdir -p build-reports
        ruff --version

        echo "Running Ruff (GitHub format)..."
        set +e
        ruff check . --output-format=github --output-file=build-reports/ruff-github.txt
        rc=$$?
        set -e

        echo "$${rc}" > /tmp/ruff-exit-code.txt

        echo ""
        echo "========== Ruff GitHub report =========="
        if [ -s build-reports/ruff-github.txt ]; then
          cat build-reports/ruff-github.txt
        elif [ "$${rc}" -eq 0 ]; then
          echo "No issues — Ruff check passed."
        fi
        echo "======================================="

  - id: ruff-report
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    dir: /workspace
    waitFor: ['ruff-check']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        repo="$${REPO_FULL_NAME:-${_GITHUB_REPO_NAME}}"
        repo_safe="$$(echo "$${repo}" | tr '/:' '-' | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]')"
        repo_safe="$${repo_safe:-unknown-repo}"
        build_date="$$(date -u +%Y-%m-%d)"
        rc="$$(cat /tmp/ruff-exit-code.txt)"

        if [ "$${rc}" -eq 0 ]; then
          status="PASSED"
          severity="INFO"
        else
          status="FAILED"
          severity="ERROR"
        fi



        log_name="ruff-$${repo_safe}"
        finding_count=0
        if [ -f build-reports/ruff-github.txt ]; then
          while IFS= read -r line || [ -n "$${line}" ]; do
            [ -z "$${line}" ] && continue
            case "$${line}" in
              ::error*)
                entry_severity="ERROR"
                ;;
              ::warning*)
                entry_severity="WARNING"
                ;;
              ::notice*)
                entry_severity="INFO"
                ;;
              *)
                continue
                ;;
            esac
            gcloud logging write "$${log_name}" "$${line}" \
              --payload-type=text \
              --severity="$${entry_severity}"
            finding_count=$$((finding_count + 1))
          done < build-reports/ruff-github.txt
        fi

        if [ "$${finding_count}" -eq 0 ]; then
          gcloud logging write "$${log_name}" \
            "Ruff $${status} | $${repo} | $${build_date} | build $${BUILD_ID}" \
            --severity="$${severity}"
        else
          echo "Posted $${finding_count} Ruff finding(s) to Cloud Logging log: $${log_name}"
        fi

        if [ "$${rc}" -ne 0 ]; then
          echo "ERROR: Ruff check failed. Fix issues before merging."
          exit "$${rc}"
        fi
