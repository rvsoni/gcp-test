# Copy to repo root as cloudbuild_dag.yaml. Trigger must define substitution _BUILD_LOGS_BUCKET (Terraform does).
# Required when the trigger sets service_account: set logsBucket (a) or options.logging CLOUD_LOGGING_ONLY (c).

logsBucket: '${_BUILD_LOGS_BUCKET}'

options:
  logging: GCS_ONLY

steps:
### Dev needs to add tests step ###
  - id: deploy-devint
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "devint" ]; then
          gsutil -m rsync -r -d \
            --exclude='.*__pycache__.*|.*\.pyc$$|.*__init__\.py$$' \
            dags/ gs://$DEVINT_DAGS_BUCKET/ && \
          gsutil -m rsync -r -d \
            --exclude='.*__pycache__.*|.*\.pyc$$' \
            tests/ gs://$DEVINT_DAGS_BUCKET/
        fi
