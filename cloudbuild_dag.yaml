logsBucket: '${_BUILD_LOGS_BUCKET}'

options:
  logging: GCS_ONLY

steps:
  - id: airflow-dag-itest
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - 'MYENV=${_SOURCE_BRANCH}'
    args:
      - -c
      - |
        set -euo pipefail
        
        echo "Airflow DAG Unit Test & Integration Test"

        escape_sed_repl() {
            printf '%s' "$1" | sed \
              -e 's/[\/&]/\\&/g' \
              -e 's/\\/\\\\/g'
          }
       
        ESCAPED_ENV="$(escape_sed_repl "$MYENV")"
          ESCAPED_PROJECT_ID="$(escape_sed_repl "$PROJECT_ID")"

          sed \
            -e 's|${ENV}|'"$ESCAPED_ENV"'|g' \
            -e 's|${PROJECT_ID}|'"$ESCAPED_PROJECT_ID"'|g' \
            /workspace/config.yaml > /workspace/config-2.yaml
              
        gsutil -m rsync -r -d \
          -x '^\.git/.*' \
          -x '.*/__pycache__/.*' \
          -x '.*\.pyc$$' \
          /workspace "gs://${_BUCKET_NAME}/"
      
