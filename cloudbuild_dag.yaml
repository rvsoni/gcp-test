logsBucket: '${_BUILD_LOGS_BUCKET}'

options:
  logging: GCS_ONLY

steps:
  - id: airflow-dag-itest
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        
        echo "Airflow DAG Unit Test & Integration Test"

        d='$$'
        escape_sed_repl() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/&/\\&/g'; }
        sed -e 's#\$$${PROJECT_ID}#'"$$(escape_sed_repl "$$PROJECT_ID")"'#g' \
            /workspace/config.yaml > /workspace/config-2.yaml
              
        gsutil -m rsync -r -d \
          -x '^\.git/.*' \
          -x '.*/__pycache__/.*' \
          -x '.*\.pyc$$' \
          /workspace "gs://${_BUCKET_NAME}/"
      
