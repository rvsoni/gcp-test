logsBucket: '${_BUILD_LOGS_BUCKET}'

options:
  logging: GCS_ONLY

timeout: '1800s'

substitutions:
  _AIRFLOW_VERSION: '3.1.7'
  _PYTHON_VERSION: '3.13'

steps:
  - id: airflow-dag-ci
    name: 'apache/airflow:${_AIRFLOW_VERSION}-python${_PYTHON_VERSION}'
    dir: /workspace
    entrypoint: bash

    env:
      - 'AIRFLOW_HOME=/workspace/.airflow'
      - 'AIRFLOW__CORE__DAGS_FOLDER=/workspace/dags'
      - 'AIRFLOW__CORE__LOAD_EXAMPLES=False'
      - 'AIRFLOW__CORE__UNIT_TEST_MODE=True'
      - 'AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow.db'
      - 'PYTHONPATH=/workspace/src:/workspace/dags'

    args:
      - -c
      - |
        set -euo pipefail

        # Cloud Build runs as root. PATH often puts /home/airflow/.local/bin first; that airflow
        # wrapper can invoke a Python that does not see the image's Airflow install → ModuleNotFoundError.
        export PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

        python --version

        python -m airflow version
        python -m pip install --no-cache-dir uv

        uv sync --all-groups

        python -m pip install -e .

        python -m airflow db migrate

        python -m airflow dags list
   
