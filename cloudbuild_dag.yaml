logsBucket: '${_BUILD_LOGS_BUCKET}'

options:
  logging: GCS_ONLY

timeout: '1800s'

substitutions:
  _AIRFLOW_VERSION: '3.1.7'
  _PYTHON_VERSION: '3.11'

steps:
  - id: airflow-dag-itest
    name: 'apache/airflow:${_AIRFLOW_VERSION}-python${_PYTHON_VERSION}'
    dir: /workspace
    # Must use /entrypoint so PYTHONPATH includes /home/airflow/.local/.../site-packages
    # when Cloud Build runs the container as root (see entrypoint_prod.sh).
    entrypoint: /entrypoint

    env:
      - 'PATH=/home/airflow/.local/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'CONNECTION_CHECK_MAX_COUNT=0'
      - 'AIRFLOW_HOME=/tmp/.airflow'
      - 'AIRFLOW__CORE__DAGS_FOLDER=/workspace/dags'
      - 'AIRFLOW__CORE__LOAD_EXAMPLES=False'
      - 'AIRFLOW__CORE__UNIT_TEST_MODE=True'
      - 'AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/.airflow/airflow.db'
      - 'PYTHONPATH=/home/airflow/.local/lib/python${_PYTHON_VERSION}/site-packages:/workspace:/workspace/dags'
      - 'AIRFLOW_CONSTRAINTS_URL=https://raw.githubusercontent.com/apache/airflow/constraints-${_AIRFLOW_VERSION}/constraints-${_PYTHON_VERSION}.txt'

    args:
      - bash
      - -c
      - |
        set -euo pipefail

        echo "Python environment:"
        id
        which python3
        python3 --version
        which airflow
        python3 -c "import airflow; print('airflow', airflow.__version__)"

        echo "Verifying Airflow CLI..."
        airflow version

        echo "Initializing Airflow metadata DB..."
        mkdir -p "$${AIRFLOW_HOME}"
        airflow db migrate
        
        echo "Starting Airflow services..."
        /entrypoint webserver &

        API_PID=$!
        # Wait until healthy (better than sleep 30)
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
            echo "Airflow webserver is up"
            break
          fi
          sleep 2
        done
        
        echo "Airflow services started..."
        
